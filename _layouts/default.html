<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  {% seo %}
  {%- comment -%}
    Not {% feed_meta %}: it advertises the site.posts feed, which is empty —
    reports are a collection. See the `feed:` block in _config.yml.
  {%- endcomment -%}
  <link type="application/atom+xml" rel="alternate"
        href="{{ '/feed.xml' | absolute_url }}" title="{{ site.title | escape }}" />
</head>
<body>
<nav>
  <a class="nav-brand" href="{{ '/' | relative_url }}">
    <div class="brand-icon">P</div>
    PatchBook
  </a>
  <div class="nav-links">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Reports</a>
    <a href="{{ '/about' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>About</a>
  </div>
</nav>
{{ content }}
<footer>
  <div class="footer-inner">
    <span>PatchBook — Windows kernel CVE analysis</span>
    <span>Windows kernel patch analysis</span>
  </div>
</footer>
</body>
</html>
