title: PatchBook
description: Windows kernel CVE analysis — binary diffs and patch breakdowns
url: "https://cvepatchbook.com"
# Served from the apex custom domain cvepatchbook.com, i.e. at the site root — so
# baseurl must be empty. (It was "/PatchBook" when the site lived at the GitHub
# project URL tzvironen.github.io/PatchBook; leaving it set makes every
# relative_url asset resolve to /PatchBook/assets/... and 404 on the domain.)
baseurl: ""
author: tzvironen

# Source repo backing the site — used to build edit-suggestion links (GitHub
# web-editor & prefilled issue URLs). See _layouts/post.html and
# assets/patchbook.js.
github_repo: TzviRonen/PatchBook
github_branch: main

# Vote API (Cloudflare Worker + D1, source in worker/). Counts and voter names
# are read live from here on every page load; nothing about votes is stored in
# this repo. Leave blank to disable the vote UI entirely.
votes_api: "https://patchbook-votes.tzvironen.workers.dev"

theme: null
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Reports are a custom collection rather than Jekyll's built-in `posts`, so the
# directory and the URLs both read "report". Two consequences of leaving
# `_posts`: collections do not derive the date from the filename (every report
# carries a `date:` in frontmatter, so that is covered) and they are not sorted
# for you — see the explicit sort in _layouts/home.html.
collections:
  reports:
    output: true
    permalink: /reports/:slug/

# jekyll-feed always emits a feed for site.posts, which is now permanently
# empty. Park that at an unused path so it cannot win the /feed.xml filename,
# and publish the reports feed there instead — /feed.xml is the URL readers and
# aggregators already have. default.html links it explicitly rather than via
# {% feed_meta %}, which would advertise the empty posts feed.
feed:
  path: /feed-unused.xml
  collections:
    reports:
      path: /feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - setup.sh
  - serve.sh
  - worker
  - test
